openapi: 3.0.3

info:
  title: Телеметрия 2. Распределенная система станка с ЧПУ
  description: |-
    Документация OpenAPI для распределенной системы телеметрии и управления в реальном времени
    «Телеметрия 2. Программа станка с ЧПУ».

    ## Обзор системы

    Система состоит из трех независимых уровней:

    1. **Прикладной уровень**
       - Терминал оператора на базе React.
       - Обеспечивает вход, выход, интерфейс чата/терминала и связь через Server-Sent Events (SSE).
       - Отправляет управляющие команды станку.
       - Получает агрегированную телеметрию и уведомления об ошибках через SSE.

    2. **Транспортный уровень**
       - Получает сегменты телеметрии от агентного уровня.
       - Эмулирует сетевую нагрузку и потерю пакетов.
       - Сохраняет принятые сегменты в очередь.
       - Агрегирует сегменты каждые 5 секунд.
       - Передает агрегированную телеметрию на прикладной уровень с помощью SSE.

    3. **Агентный уровень**
       - Эмулирует станок с ЧПУ на 2D-поверхности с позиционированием инструмента по оси Z.
       - Выполняет такие команды, как сверление (drilling) и фрезеровка (milling).
       - Генерирует телеметрию.
       - Разбивает телеметрию на сегменты размером до 256 байт.
       - Отправляет сегменты на транспортный уровень по HTTP.

    ## Соглашение о координатах

    Координатная модель использует:

    - `x` — горизонтальное положение на рабочей поверхности.
    - `y` — вертикальное положение на рабочей поверхности.
    - `z` — высота или глубина погружения инструмента.

    Рекомендуемое соглашение:

    - `z = 0` соответствует базовой рабочей поверхности.
    - Положительные значения `z` представляют безопасную высоту над поверхностью.
    - Отрицательные значения `z` представляют погружение инструмента ниже поверхности.

  version: 1.2.0

tags:
  - name: Application
    description: |-
      Эндпоинты прикладного уровня.

      Отвечают за аутентификацию оператора, состояние сессии и SSE-соединение
      с терминалом для получения телеметрии.

  - name: Transport
    description: |-
      Эндпоинты транспортного уровня.

      Получают сегменты телеметрии от агентного уровня, эмулируют потерю пакетов,
      ставит сегменты в очередь и передают агрегированную телеметрию по SSE на прикладной уровень.

  - name: Agent
    description: |-
      Эндпоинты агентного уровня.

      Эмулируют поведение станка с ЧПУ, принимают управляющие команды и предоставляют
      информацию о текущем состоянии станка.

  - name: Calibration
    description: |-
      Эндпоинты калибровки.

      Используются для настройки или проверки смещений координат станка, смещения инструмента
      и базового положения по оси Z.

servers:
  - url: http://localhost:3000/api/v1
    description: Сервер прикладного уровня

  - url: http://localhost:8001/api/v1
    description: Сервер транспортного уровня

  - url: http://localhost:8002/api/v1
    description: Сервер агентного уровня

paths:

  /login:
    post:
      tags:
        - Application
      operationId: applicationLogin
      summary: Вход оператора в систему
      description: |-
        Выполняет вход оператора и подготавливает сессию терминала приложения.

        Введенное имя пользователя передается с каждым новым сообщением команды
        в поле `sender`.

        После успешного входа фронтенд должен открыть SSE-соединение
        к эндпоинту `/sse` для получения потока телеметрии.

      x-requirements:
        - clause: 5.a.ii
          description: Пользователь вводит имя с помощью кнопки «Войти».
        - clause: 5.a.iii
          description: Имя пользователя передается с каждым новым сообщением.

      servers:
        - url: http://localhost:3000/api/v1
          description: Базовый URL прикладного уровня

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              operatorLogin:
                summary: Вход оператора
                value:
                  username: operator1

      responses:
        '200':
          description: Успешный вход
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  summary: Успешная авторизация
                  value:
                    status: ok
                    username: operator1
                    sseUrl: http://localhost:3000/api/v1/sse?username=operator1
                    sessionId: 9f8a6f4e-1c2b-4c3d-8e9f-abcdef123456

        '400':
          $ref: '#/components/responses/BadRequest'

        '500':
          $ref: '#/components/responses/InternalServerError'

  /logout:
    post:
      tags:
        - Application
      operationId: applicationLogout
      summary: Выход оператора из системы
      description: |-
        Очищает состояние входа и чата.

        Фронтенд должен закрыть SSE-соединение после выхода.
        История чата не должна сохраняться после перезагрузки страницы.

      x-requirements:
        - clause: 5.a.vi
          description: Выход очищает чат, логин и закрывает SSE-соединение.

      servers:
        - url: http://localhost:3000/api/v1
          description: Базовый URL прикладного уровня

      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            examples:
              operatorLogout:
                summary: Запрос выхода
                value:
                  username: operator1

      responses:
        '200':
          description: Успешный выход
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              examples:
                success:
                  summary: Успешный выход
                  value:
                    status: ok
                    username: operator1

        '400':
          $ref: '#/components/responses/BadRequest'

        '500':
          $ref: '#/components/responses/InternalServerError'

  /session:
    get:
      tags:
        - Application
      operationId: applicationSession
      summary: Получить состояние текущей сессии
      description: |-
        Вспомогательный эндпоинт для фронтенда.

        Может использоваться для восстановления состояния UI после навигации
        или для проверки того, вошел ли оператор в систему в данный момент.

      servers:
        - url: http://localhost:3000/api/v1
          description: Базовый URL прикладного уровня

      responses:
        '200':
          description: Информация о текущей сессии
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
              examples:
                loggedIn:
                  summary: Сессия активна
                  value:
                    loggedIn: true
                    username: operator1
                    expiresAt: '2026-05-01T12:00:00Z'
                anonymous:
                  summary: Анонимная сессия
                  value:
                    loggedIn: false
                    username: null
                    expiresAt: null

        '500':
          $ref: '#/components/responses/InternalServerError'

  /sse:
    get:
      tags:
        - Application
      operationId: applicationSSEStream
      summary: SSE-эндпоинт прикладного уровня
      description: |-
        SSE-эндпоинт для терминала оператора для получения телеметрии и результатов команд.

        ## Структура потока событий

        Соединение остается открытым и передает фреймы формата `text/event-stream`.

        ### Типы событий
        - `telemetry` (содержит `SseTelemetryMessage`)
        - `command_ack` (содержит статус команды)

        ## Пример серверного события телеметрии

        ```text
        event: telemetry
        data: {"type": "telemetry", "sender": "transport-level", "timestamp": "2026-05-01T10:00:05Z", "error": false, "payload": {"commandName": "milling", "position": {"x": 3.2, "y": 1.1, "z": -0.8}, "finished": false}}
        ```

        ## Поведение при ошибках

        Если телеметрия неполная из-за потери сегментов на транспортном уровне,
        сервер отправляет событие с флагом `error = true`.

        Пример:

        ```text
        event: telemetry
        data: {"type": "telemetry", "sender": "transport-level", "timestamp": "2026-05-01T10:00:10Z", "error": true, "reason": "Incomplete telemetry segments were received"}
        ```

        В этом случае фронтенд должен отобразить значок ошибки и не должен
        выводить текст телеметрии.

      x-requirements:
        - clause: 5.a.ii
          description: SSE-соединение открывается после входа (вместо WebSocket).
        - clause: 5.a.iv
          description: Метод приема принимает JSON телеметрии через SSE.
        - clause: 5.a.v
          description: Сообщения об ошибках отображаются как индикаторы ошибок.

      servers:
        - url: http://localhost:3000/api/v1
          description: Базовый URL прикладного уровня

      parameters:
        - name: username
          in: query
          required: false
          description: Необязательное имя пользователя, используемое при установке SSE-соединения.
          schema:
            type: string
            example: operator1

      responses:
        '200':
          description: Поток SSE успешно установлен.
          headers:
            Content-Type:
              description: Тип содержимого потока событий
              schema:
                type: string
                example: text/event-stream
            Cache-Control:
              description: Запрет кеширования
              schema:
                type: string
                example: no-cache
            Connection:
              description: Поддержание соединения активным
              schema:
                type: string
                example: keep-alive
          content:
            text/event-stream:
              schema:
                type: string
                description: Поток блоков данных в формате SSE
                example: "event: telemetry\ndata: {...}\n\n"

        '400':
          $ref: '#/components/responses/BadRequest'

        '500':
          $ref: '#/components/responses/InternalServerError'

  /commands:
    post:
      tags:
        - Application
      operationId: applicationSendCommand
      summary: Отправить управляющую команду в систему
      description: |-
        Отправляет управляющую команду из фронтенд-приложения для маршрутизации на агент.
      servers:
        - url: http://localhost:3000/api/v1
          description: Базовый URL прикладного уровня

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandPayload'
            examples:
              millingCommand:
                summary: Команда фрезеровки
                value:
                  commandId: 1f0f6a4e-6a1f-4f8a-9f2a-5f6d1f0e4d11
                  operation: milling
                  start:
                    x: 0
                    y: 0
                    z: 5
                  end:
                    x: 10
                    y: 5
                    z: -1.5
                  depth: 1.5
                  safeZ: 5
                  durationMs: 4000

      responses:
        '202':
          description: Команда принята и поставлена в очередь для передачи
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted

        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /segments:
    post:
      tags:
        - Transport
      operationId: transportReceiveSegment
      summary: Получить сегмент телеметрии от агентного уровня
      description: |-
        Получает сегмент телеметрии от агентного уровня.

        Агентный уровень разбивает телеметрию на сегменты размером до 256 байт и
        отправляет каждый сегмент отдельным HTTP-запросом.

        ## Очередь

        Принятые сегменты помещаются в транспортную очередь (Kafka).

        ## Эмуляция нагрузки (потери пакетов)

        Перед помещением в очередь транспортный уровень эмулирует потерю пакетов:
        - каждый сегмент может быть отброшен с вероятностью 2%;
        - отброшенные сегменты не попадают в очередь.

      x-requirements:
        - clause: 5.b.i
          description: HTTP-метод получает сегменты и помещает их в очередь.
        - clause: 5.b.ii
          description: Искусственная потеря пакетов с вероятностью 2%.
        - clause: 5.b.v
          description: Формат сегмента включает полезную нагрузку, время отправки, общую длину и номер сегмента.

      servers:
        - url: http://localhost:8001/api/v1
          description: Базовый URL транспортного уровня

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransportSegment'

      responses:
        '202':
          description: Сегмент получен и помещен в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentAcceptResponse'

        '200':
          description: Сегмент получен, но отброшен симулятором потерь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentAcceptResponse'

        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /telemetry/stream:
    get:
      tags:
        - Transport
      operationId: transportTelemetryStream
      summary: SSE-поток телеметрии транспортного уровня
      description: |-
        SSE-эндпоинт, используемый транспортным уровнем для отправки агрегированной телеметрии
        на прикладной уровень.

        ## Поведение агрегации

        - Каждые 5 секунд транспортный уровень забирает сегменты из очереди.
        - Собранные сегменты собираются в одно сообщение телеметрии.
        - Полученное сообщение отправляется на прикладной уровень через SSE.

        ## Поведение при неполных данных

        Если некоторые сегменты не были получены из-за потерь (отсутствие новых данных от 1 до 3 циклов),
        финальное агрегированное сообщение отправляется с флагом `error = true`.

      x-requirements:
        - clause: 5.b.iii
          description: Сегменты агрегируются каждые 5 секунд и отправляются по SSE.
        - clause: 5.b.iv
          description: Неполные данные отправляются с флагом ошибки.

      servers:
        - url: http://localhost:8001/api/v1
          description: Базовый URL транспортного уровня

      parameters:
        - name: username
          in: query
          required: false
          description: Необязательное имя оператора
          schema:
            type: string
            example: operator1

      responses:
        '200':
          description: SSE-поток установлен.
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: telemetry\ndata: {...}\n\n"

        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /agent/commands:
    post:
      tags:
        - Agent
      operationId: agentReceiveCommand
      summary: Отправить управляющую команду эмулятору станка с ЧПУ
      description: |-
        Отправляет управляющую команду на агентный уровень.
      servers:
        - url: http://localhost:8002/api/v1
          description: Базовый URL агентного уровня

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCommandEnvelope'

      responses:
        '202':
          description: Команда принята к исполнению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /state:
    get:
      tags:
        - Agent
      operationId: agentGetState
      summary: Получить текущее состояние станка с ЧПУ
      servers:
        - url: http://localhost:8002/api/v1
          description: Базовый URL агентного уровня
      responses:
        '200':
          description: Текущее состояние станка с ЧПУ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineStateResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  headers:
    XRequestId:
      description: Уникальный идентификатор запроса для отладки
      schema:
        type: string
        example: 7d9f1d2e-5b7c-4c3a-9f1e-8a2b3c4d5e6f

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: BadRequest
        message:
          type: string
          example: Тело запроса некорректно

    Position2D:
      type: object
      required:
        - x
        - y
      properties:
        x:
          type: number
          format: double
          example: 10.5
        y:
          type: number
          format: double
          example: -2.0

    Position3D:
      allOf:
        - $ref: '#/components/schemas/Position2D'
        - type: object
          required:
            - z
          properties:
            z:
              type: number
              format: double
              example: -1.5

    LoginRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          example: operator1

    LoginResponse:
      type: object
      required:
        - status
        - username
        - sseUrl
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        username:
          type: string
          example: operator1
        sseUrl:
          type: string
          format: uri
          example: http://localhost:3000/api/v1/sse?username=operator1
        sessionId:
          type: string
          example: 9f8a6f4e-1c2b-4c3d-8e9f-abcdef123456

    LogoutRequest:
      type: object
      properties:
        username:
          type: string
          example: operator1

    LogoutResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
        username:
          type: string
          example: operator1

    SessionInfo:
      type: object
      required:
        - loggedIn
      properties:
        loggedIn:
          type: boolean
          example: true
        username:
          type: string
          nullable: true
          example: operator1
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-01T12:00:00Z'

    CommandPayload:
      type: object
      required:
        - operation
        - start
        - end
        - depth
        - durationMs
      properties:
        commandId:
          type: string
          format: uuid
          example: 1f0f6a4e-6a1f-4f8a-9f2a-5f6d1f0e4d11
        operation:
          type: string
          enum:
            - drilling
            - milling
          example: milling
        start:
          $ref: '#/components/schemas/Position3D'
        end:
          $ref: '#/components/schemas/Position3D'
        depth:
          type: number
          format: double
          example: 1.5
        safeZ:
          type: number
          format: double
          example: 5.0
        durationMs:
          type: integer
          format: int64
          example: 4000

    TelemetryPayload:
      type: object
      required:
        - commandName
        - position
      properties:
        commandName:
          type: string
          example: milling
        position:
          $ref: '#/components/schemas/Position3D'
        finished:
          type: boolean
          example: false

    SseTelemetryMessage:
      type: object
      required:
        - type
        - sender
        - timestamp
        - error
      properties:
        type:
          type: string
          enum:
            - telemetry
          example: telemetry
        sender:
          type: string
          example: transport-level
        timestamp:
          type: string
          format: date-time
          example: '2026-05-01T10:00:05Z'
        error:
          type: boolean
          example: false
        payload:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TelemetryPayload'
        reason:
          type: string
          nullable: true
          example: Incomplete telemetry segments were received

    TransportSegment:
      type: object
      required:
        - sentAt
        - totalSegments
        - segmentNumber
        - payload
      properties:
        sentAt:
          type: string
          format: date-time
          example: '2026-05-01T10:00:00.000Z'
        totalSegments:
          type: integer
          minimum: 1
          example: 3
        segmentNumber:
          type: integer
          minimum: 1
          example: 1
        payload:
          type: string
          format: byte
          example: eyJjb21tYW5kTmFtZSI6Im1pbGxpbmciLCJwb3NpdGlvbiI6eyJ4IjozLjIsInkiOjEuMSwieiI6LTAuOH19

    SegmentAcceptResponse:
      type: object
      required:
        - messageId
        - segmentNumber
        - queued
      properties:
        messageId:
          type: string
          example: '2026-05-01T10:00:00.000Z'
        segmentNumber:
          type: integer
          example: 1
        queued:
          type: boolean
          example: true
        dropped:
          type: boolean
          default: false
          example: false

    AgentCommandEnvelope:
      type: object
      required:
        - sender
        - timestamp
        - payload
      properties:
        sender:
          type: string
          example: operator1
        timestamp:
          type: string
          format: date-time
          example: '2026-05-01T10:00:00Z'
        payload:
          $ref: '#/components/schemas/CommandPayload'

    CommandAccepted:
      type: object
      required:
        - status
        - acceptedAt
      properties:
        status:
          type: string
          enum:
            - accepted
          example: accepted
        commandId:
          type: string
          format: uuid
          nullable: true
          example: 1f0f6a4e-6a1f-4f8a-9f2a-5f6d1f0e4d11
        acceptedAt:
          type: string
          format: date-time
          example: '2026-05-01T10:00:00Z'

    MachineStateResponse:
      type: object
      required:
        - timestamp
        - state
        - telemetry
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-05-01T10:00:05Z'
        state:
          type: string
          enum:
            - idle
            - running
            - error
          example: running
        telemetry:
          $ref: '#/components/schemas/TelemetryPayload'