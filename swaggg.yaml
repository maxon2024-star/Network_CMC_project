openapi: 3.0.3
info:
  title: Distributed CNC Control System API
  version: 2.0.0
  description: >
    Спецификация межсервисного взаимодействия распределённой системы управления
    станком с ЧПУ (Application Level, Agent Level, Transport Level).

servers:
  - url: http://localhost:3000
    description: Прикладной уровень (Node.js App Server & SSE Broker)
  - url: http://localhost:8002
    description: Агентный уровень (FastAPI + ROS 2 CNC Emulator)
  - url: http://localhost:8001
    description: Транспортный уровень (FastAPI + Kafka Assembler)

tags:
  - name: Application Level
    description: Валидация команд, приём агрегированной телеметрии и SSE-стриминг в браузер
  - name: Agent Level
    description: Постановка управляющих программ в очередь станка с ЧПУ
  - name: Transport Level
    description: Приём сегментов телеметрии и эмуляция сетевых потерь

paths:
  /api/v1/commands:
    post:
      tags:
        - Application Level
        - Agent Level
      summary: Отправка управляющей программы (сырой ввод на App Server / одиночная команда на Agent)
      description: >
        На прикладном уровне (:3000) принимает сырой текст или JSON от UI, выполняет валидацию
        синтаксиса и границ рабочей зоны, после чего пересылает на :8002 (/commands или /commands/batch).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RawCommandSubmitRequest'
                - $ref: '#/components/schemas/SingleAgentCommandRequest'
      responses:
        '202':
          description: Команда принята в обработку
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
                  operationsCount:
                    type: integer
                    example: 1
        '400':
          description: Ошибка валидации синтаксиса или выхода за рабочую область
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Агентный уровень недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/commands/batch:
    post:
      tags:
        - Agent Level
      summary: Пакетная постановка списка операций в очередь станка (Agent Level :8002)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAgentCommandRequest'
      responses:
        '202':
          description: Пакет команд принят в очередь станка
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
                  queuedCount:
                    type: integer
                    example: 3

  /api/v1/telemetry:
    post:
      tags:
        - Application Level
      summary: Приём собранного состояния станка или ошибки сегментации от транспортного уровня (:3000)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SseTelemetryMessage'
      responses:
        '202':
          description: Сообщение принято и отправлено подключённым SSE-клиентам
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
                  clients:
                    type: integer
                    example: 1
        '400':
          description: Некорректный JSON в теле запроса

  /api/v1/telemetry/stream:
    get:
      tags:
        - Application Level
      summary: Подписка браузера на SSE-поток телеметрии и пингов (:3000)
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            example: operator1
      responses:
        '200':
          description: Поток событий Server-Sent Events (event telemetry и event ping каждые 1.5 с)
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: ping
                  data: {"type":"ping"}

                  event: telemetry
                  data: {"timestamp":"2026-11-21T00:15:00Z","error":false,"payload":{"commandName":"drilling","position":{"x":120,"y":80,"z":-5},"finished":false}}

  /api/v1/segments:
    post:
      tags:
        - Transport Level
      summary: Приём одного сегмента телеметрии (<= 256 Б) от агентного уровня (:8001)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransportSegment'
      responses:
        '202':
          description: Сегмент принят и помещён в очередь Kafka
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentAcceptResponse'
        '200':
          description: Сегмент отброшен симулятором сетевых потерь (вероятность 2%)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentAcceptResponse'
        '400':
          description: Номер сегмента превышает totalSegments

components:
  schemas:
    Coordinates2D:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1000
          example: 120
        y:
          type: number
          minimum: 0
          maximum: 1000
          example: 80

    Coordinates3D:
      type: object
      required: [x, y, z]
      properties:
        x:
          type: number
          example: 120
        y:
          type: number
          example: 80
        z:
          type: number
          example: -5

    CncOperation:
      type: object
      required: [operation, start, end, depth, duration]
      properties:
        operation:
          type: string
          enum: [drilling, milling]
        start:
          $ref: '#/components/schemas/Coordinates2D'
        end:
          $ref: '#/components/schemas/Coordinates2D'
        depth:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          example: 5
        duration:
          type: number
          exclusiveMinimum: 0
          maximum: 3600
          example: 2.5

    RawCommandSubmitRequest:
      type: object
      required: [sender, rawInput]
      properties:
        sender:
          type: string
          example: operator1
        rawInput:
          type: string
          example: "D 120 80 5 2.5"

    SingleAgentCommandRequest:
      type: object
      required: [sender, timestamp, payload]
      properties:
        sender:
          type: string
          example: operator1
        timestamp:
          type: string
          format: date-time
        payload:
          $ref: '#/components/schemas/CncOperation'

    BatchAgentCommandRequest:
      type: object
      required: [sender, timestamp, commands]
      properties:
        sender:
          type: string
          example: operator1
        timestamp:
          type: string
          format: date-time
        commands:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CncOperation'

    TransportSegment:
      type: object
      required: [sentAt, sender, totalSegments, segmentNumber, payload]
      properties:
        sentAt:
          type: string
          format: date-time
        sender:
          type: string
          example: cnc-agent
        totalSegments:
          type: integer
          minimum: 1
          example: 1
        segmentNumber:
          type: integer
          minimum: 1
          example: 1
        payload:
          type: string
          description: Фрагмент исходного JSON (<= 256 байт), закодированный в Base64
          example: eyJjb21tYW5kTmFtZSI6ImRyaWxsaW5nIn0=

    SegmentAcceptResponse:
      type: object
      required: [messageId, segmentNumber, queued, dropped, detail]
      properties:
        messageId:
          type: string
        segmentNumber:
          type: integer
        queued:
          type: boolean
        dropped:
          type: boolean
        detail:
          type: string

    TelemetryPayload:
      type: object
      required: [commandName, position, finished]
      properties:
        commandName:
          type: string
          enum: [idle, retract, positioning, plunge, drilling, milling, return_home]
        position:
          $ref: '#/components/schemas/Coordinates3D'
        finished:
          type: boolean

    SseTelemetryMessage:
      type: object
      required: [timestamp, error]
      properties:
        timestamp:
          type: string
          format: date-time
        error:
          type: boolean
        reason:
          type: string
          nullable: true
          example: Incomplete telemetry segments were received
        payload:
          $ref: '#/components/schemas/TelemetryPayload'

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        source:
          type: string
          enum: [validation, agent]
        detail:
          type: string
