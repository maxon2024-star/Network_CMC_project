services:
  application-service:
    build: .
    container_name: application-service
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      AGENT_URL: ${AGENT_URL:-http://host.docker.internal:8002}
      PING_INTERVAL_MS: ${PING_INTERVAL_MS:-5000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
